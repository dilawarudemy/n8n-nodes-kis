name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug auth (IMPORTANT)
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: 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

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: 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
